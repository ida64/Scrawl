name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Releases are built one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    # Scrawl is built with Xcode 27 (macOS 26 SDK features, Swift 6.4).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      VERSION: "1.0.${{ github.run_number }}"
      DERIVED_DATA: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        env:
          # TEST_RUNNER_-prefixed variables are forwarded to the test process (prefix removed).
          # Shared CI machines are slower, so performance budgets are relaxed there.
          TEST_RUNNER_SCRAWL_PERF_SCALE: "4"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Scrawl.xcodeproj \
            -scheme Scrawl \
            -destination 'platform=macOS' \
            -only-testing:ScrawlTests \
            -derivedDataPath "$DERIVED_DATA/test" \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY=- \
            | tail -n 60

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/UnitTests.xcresult

      - name: Build universal Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Scrawl.xcodeproj \
            -scheme Scrawl \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA/release" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40
          APP="$DERIVED_DATA/release/Build/Products/Release/Scrawl.app"
          test -d "$APP"
          lipo -info "$APP/Contents/MacOS/Scrawl"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Scrawl-$VERSION.zip"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Scrawl $VERSION" -srcfolder "$STAGE" -ov -format UDZO "dist/Scrawl-$VERSION.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Automated build of \`${GITHUB_SHA::7}\` from \`main\`.

          **Install:** download the \`.dmg\` (or \`.zip\`), then drag Scrawl to Applications.
          Requires macOS 26 or later. Universal: Apple silicon and Intel.

          This build is ad-hoc signed and not notarized, so the first launch needs
          right-click → **Open** (or System Settings → Privacy & Security → **Open Anyway**).
          NOTES
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Scrawl $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
